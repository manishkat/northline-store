<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Store admin — NORTHLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Helvetica,Arial,sans-serif;font-size:14px;color:#111;background:#f4f4f2;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap}
.top b{letter-spacing:.3em;font-weight:600}
.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid #000;background:#000;color:#fff;font-size:13px;font-weight:500;border-radius:6px;white-space:nowrap}
.btn:hover{background:#333}.btn.out{background:#fff;color:#000}.btn.out:hover{background:#eee}
.btn.white{background:#fff;color:#000;border-color:#fff}.btn.ghost{background:transparent;border-color:#555;color:#fff}
.btn.red{background:#fff;color:#b00020;border-color:#e6b3bb}.btn.red:hover{background:#fdeef0}
.btn.green{background:#0a7a3f;border-color:#0a7a3f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:10px;padding:22px;border:1px solid #e6e6e2}
.login{max-width:560px;margin:60px auto}
.login h1{font-size:22px;margin-bottom:6px}
.login ol{margin:14px 0 18px 20px;color:#444}.login li{margin-bottom:6px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:#555}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{border:1px solid #d6d6d2;border-radius:6px;padding:9px 11px;background:#fff;font-size:14px;color:#111;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #000;outline-offset:-1px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #d6d6d2;background:#fff;font-size:13px}
.tab.on{background:#000;color:#fff;border-color:#000}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{width:auto;flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;background:#fff}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#777;text-align:left;padding:10px;border-bottom:1px solid #e6e6e2;font-weight:500}
td{padding:10px;border-bottom:1px solid #f0f0ec;vertical-align:middle}
td img{width:48px;height:64px;object-fit:cover;border-radius:4px;background:#eee}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;margin-right:4px}
.tag.sale{background:#fde7ea;color:#b00020}.tag.new{background:#e8f1ff;color:#1747a6}.tag.hid{background:#333;color:#fff}
.acts{display:flex;gap:6px;justify-content:flex-end}
.acts button{padding:6px 10px;font-size:12px}
.msg{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.msg.ok{background:#e7f6ee;color:#0a5c30}.msg.err{background:#fdeef0;color:#8a0018}.msg.info{background:#eef3fb;color:#1d3d73}
.dirty{background:#ffcf33;color:#000;font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.overlay.open{display:flex}
.panel{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgbox{width:110px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.imgbox img{width:110px;height:146px;object-fit:cover;border-radius:6px;background:#eee;border:1px solid #e6e6e2}
.imgbox .ctl{display:flex;gap:3px}.imgbox .ctl button{flex:1;padding:3px;border:1px solid #ddd;background:#fff;border-radius:4px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #d6d6d2;background:#fff;border-radius:16px;padding:5px 11px;font-size:12px}
.chip.on{background:#000;color:#fff;border-color:#000}
.chip.out{background:#fde7ea;border-color:#f3b8c1;color:#8a0018;text-decoration:line-through}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:#111}
.hint{font-size:12px;color:#777}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #eee;padding-top:16px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat div{background:#fff;border:1px solid #e6e6e2;border-radius:10px;padding:14px}.stat b{display:block;font-size:22px}
.slide{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid #eee}
.slide img{width:160px;height:100px;object-fit:cover;border-radius:6px;background:#eee}
@media (max-width:720px){.hide-m{display:none}td,th{padding:8px 6px}.slide{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
